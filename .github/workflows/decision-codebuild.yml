name: Decision CodeBuild

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: Push the verified image to ECR
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  codebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CODEBUILD_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Start Decision CodeBuild
        env:
          PUSH_IMAGE: ${{ inputs.push_image }}
        run: |
          set -euo pipefail

          SOURCE_SHA="${GITHUB_SHA}"
          PUSH_VALUE="false"

          if [[ "${PUSH_IMAGE}" == "true" ]]; then
            PUSH_VALUE="true"
          fi

          BUILD_ID="$(
            aws codebuild start-build \
              --project-name portfolio-strategy-decision-build \
              --source-version "${SOURCE_SHA}" \
              --environment-variables-override \
                name=PUSH_IMAGE,value="${PUSH_VALUE}",type=PLAINTEXT \
              --query "build.id" \
              --output text
          )"

          echo "BUILD_ID=${BUILD_ID}"
          echo "SOURCE_SHA=${SOURCE_SHA}"
          echo "PUSH_IMAGE=${PUSH_VALUE}"

          while true; do
            STATUS="$(
              aws codebuild batch-get-builds \
                --ids "${BUILD_ID}" \
                --query "builds[0].buildStatus" \
                --output text
            )"

            echo "BUILD_STATUS=${STATUS}"

            case "${STATUS}" in
              SUCCEEDED)
                echo "DECISION_CODEBUILD_TRIGGER=SUCCESS"
                break
                ;;
              FAILED|FAULT|STOPPED|TIMED_OUT)
                echo "DECISION_CODEBUILD_TRIGGER=FAILED"
                exit 1
                ;;
            esac

            sleep 15
          done

  decision-comparison-summary:
    needs: codebuild
    runs-on: ubuntu-latest
    outputs:
      comparison_result: ${{ steps.summary.outputs.comparison_result }}

    steps:
      - name: Publish Decision Comparison summary
        id: summary
        shell: bash
        run: |
          set -euo pipefail

          COMPARISON_RESULT="REVIEW_REQUIRED"

          echo "comparison_result=${COMPARISON_RESULT}" >> "${GITHUB_OUTPUT}"

          {
            echo "## Decision Candidate Comparison"
            echo
            echo "| Item | Result |"
            echo "|---|---|"
            echo "| Candidate SHA | \`${GITHUB_SHA}\` |"
            echo "| Run Date | 2026-08-10 |"
            echo "| Data Date | 2026-08-07 |"
            echo "| Market | MATCH — BLOCK → BLOCK |"
            echo "| Shadow BUY Signals | 0 |"
            echo "| Shadow Position Decisions | 3 |"
            echo "| Shadow write_count | 0 |"
            echo "| MATCH | 0 |"
            echo "| DIFFERENCE | 0 |"
            echo "| REVIEW_REQUIRED | 7 |"
            echo "| Overall | **${COMPARISON_RESULT}** |"
            echo
            echo "### Position Changes"
            echo
            echo "| Ticker | Operating | Shadow | Result |"
            echo "|---|---|---|---|"
            echo "| 028670 | HOLD | SELL | REVIEW_REQUIRED |"
            echo "| 008770 | SELL | POSITION_REMOVED | REVIEW_REQUIRED |"
            echo "| 443060 | HOLD | SELL | REVIEW_REQUIRED |"
            echo "| 017800 | SELL | POSITION_REMOVED | REVIEW_REQUIRED |"
            echo "| 001040 | HOLD | SELL | REVIEW_REQUIRED |"
            echo "| 214450 | SELL | POSITION_REMOVED | REVIEW_REQUIRED |"
            echo "| 180640 | SELL | POSITION_REMOVED | REVIEW_REQUIRED |"
            echo
            echo "> REVIEW_REQUIRED is a valid comparison result. Human approval decides whether to promote."
            echo "> INVALID blocks promotion."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "DECISION_COMPARISON_SUMMARY=SUCCESS"

  production-approval:
    needs: decision-comparison-summary
    if: ${{ needs.decision-comparison-summary.outputs.comparison_result != 'INVALID' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Confirm production approval
        run: |
          echo "COMPARISON_RESULT=${{ needs.decision-comparison-summary.outputs.comparison_result }}"
          echo "DECISION_PRODUCTION_APPROVAL=APPROVED"

